<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#F8FAFC" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Bora Comprar" />
<title>Bora Comprar</title>
<link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1MuC92zVngc48Wm9XzqRWErIS8CyT3fLp=s512" />
<link rel="apple-touch-icon" href="https://lh3.googleusercontent.com/d/1MuC92zVngc48Wm9XzqRWErIS8CyT3fLp=s512" />
<link rel="manifest" href="manifest.json" />
<style>
:root{--bg:#F8FAFC;--s:#fff;--s2:#F1F5F9;--b:#E2E8F0;--t:#0F172A;--m:#64748B;--ac:#10B981;--acs:#ECFDF5;--am:#F59E0B;--ams:#FFFBEB;--d:#EF4444;--r:14px;--sh:0 4px 20px -2px rgba(15,23,42,.05)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,sans-serif}
body{background:var(--bg);color:var(--t);display:flex;justify-content:center;min-height:100vh}
.shell{width:100%;max-width:460px;min-height:100vh;padding-bottom:96px}
.hidden{display:none!important}
button{cursor:pointer;color:var(--t)}
header{position:sticky;top:0;z-index:20;background:rgba(248,250,252,.9);backdrop-filter:blur(12px);padding:14px 20px 10px;display:flex;align-items:center;justify-content:space-between}
.hl{display:flex;align-items:center;gap:10px}
.logo{width:30px;height:30px;border-radius:8px;object-fit:cover;border:1px solid var(--b)}
.ttl{font-size:1.05rem;font-weight:700;letter-spacing:-.02em}
.ib{width:38px;height:38px;border-radius:12px;border:1px solid var(--b);background:var(--s);display:inline-flex;align-items:center;justify-content:center;font-size:1rem}
.ib.sm{width:28px;height:28px;font-size:.75rem;border-radius:9px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ac);display:inline-block}
.dot.sy{background:var(--am);animation:p 1s infinite}
@keyframes p{50%{opacity:.35}}
main{padding:8px 20px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.big{background:var(--s);border:1px solid var(--b);border-radius:20px;padding:22px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;box-shadow:var(--sh);position:relative;font-size:.9rem;font-weight:600}
.big .em{font-size:1.7rem}
.big.buy{background:var(--acs)}
.pill{position:absolute;top:10px;right:10px;background:var(--t);color:#fff;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:99px}
.box{margin-top:18px;background:var(--s);border:1px solid var(--b);border-radius:20px;padding:16px;box-shadow:var(--sh)}
.cap{font-size:.75rem;font-weight:600;color:var(--m);text-transform:uppercase;letter-spacing:.04em;margin-bottom:10px}
.in{width:100%;border:1px solid var(--b);background:var(--s2);border-radius:12px;padding:12px 14px;font-size:.9rem;color:var(--t);outline:none}
.in:focus{background:var(--s);border-color:var(--t)}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.btn{background:var(--t);color:#fff;border:none;border-radius:12px;padding:13px 16px;font-size:.88rem;font-weight:600;width:100%}
.btn.sec{background:var(--s2);color:var(--t)}
.btn.danger{background:#FEF2F2;color:var(--d)}
.btn.ok{background:var(--ac)}
.btn.fit{width:auto;padding:0 16px}
.chip{padding:7px 12px;border-radius:99px;border:1px solid var(--b);background:var(--s2);font-size:.8rem;font-weight:500}
.chip.on{background:var(--t);color:#fff;border-color:var(--t)}
.chip.am.on{background:var(--ams);border-color:var(--am);color:#B45309}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.sum{background:var(--s);border:1px solid var(--b);border-radius:var(--r);padding:12px 16px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;box-shadow:var(--sh)}
.sl{font-size:.72rem;color:var(--m);font-weight:500}
.sv{font-size:1.15rem;font-weight:800;color:var(--ac)}
.tool{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.tool .in{flex:1 1 100%}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cat{background:var(--s);border:1px solid var(--b);border-radius:var(--r);padding:18px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;position:relative;box-shadow:var(--sh)}
.cat.add{border-style:dashed;background:transparent;box-shadow:none;color:var(--m)}
.ci{width:40px;height:40px;border-radius:12px;background:var(--s2);display:flex;align-items:center;justify-content:center;font-size:1.25rem}
.cn{font-size:.78rem;font-weight:600;text-align:center}
.bdg{position:absolute;top:8px;right:8px;min-width:22px;height:22px;padding:0 6px;border-radius:99px;background:var(--ac);color:#fff;font-size:.72rem;font-weight:700;display:flex;align-items:center;justify-content:center}
.edt{display:flex;gap:4px}
.edt button{width:28px;height:28px;border-radius:8px;border:1px solid var(--b);background:var(--s);font-size:.7rem}
.list{display:flex;flex-direction:column;gap:10px}
.item{background:var(--s);border:1px solid var(--b);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--sh)}
.item.cart{border-color:#A7F3D0}
.item.dim{opacity:.5;box-shadow:none}
.tg{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tg b{font-size:.92rem}
.tag{font-size:.68rem;padding:2px 6px;border-radius:6px;background:var(--s2);color:var(--m);font-weight:600}
.cheapb,.ignb{font-size:.68rem;padding:2px 7px;border-radius:99px;font-weight:600}
.cheapb{background:var(--ams);color:#B45309;border:1px solid #FDE68A}
.ignb{background:#EEF2FF;color:#4338CA;border:1px solid #C7D2FE}
.req{font-size:.74rem;font-weight:700;background:var(--s2);padding:3px 8px;border-radius:8px}
.step{display:flex;align-items:center;gap:4px;background:var(--s2);padding:3px;border-radius:10px}
.step button{width:30px;height:30px;border:none;border-radius:8px;background:var(--s);font-weight:700;font-size:1rem}
.qi{width:52px;text-align:center;border:none;background:transparent;font-size:.88rem;font-weight:700;outline:none;color:var(--t)}
.bc{display:grid;grid-template-columns:1fr 1.1fr auto;gap:8px;align-items:end}
.fm label{display:block;font-size:.65rem;color:var(--m);font-weight:600;margin-bottom:2px}
.fm input{width:100%;padding:8px 10px;border-radius:10px;border:1px solid var(--b);background:var(--s2);font-size:.86rem;font-weight:600;outline:none;color:var(--t)}
.chk{width:42px;height:42px;border-radius:12px;border:1px solid var(--b);background:var(--s2);color:var(--m);font-size:1.1rem;font-weight:700}
.chk.on{background:var(--ac);border-color:var(--ac);color:#fff}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.acts button,.sm{font-size:.7rem;padding:5px 9px;border-radius:9px;border:1px solid var(--b);background:var(--s2);font-weight:600}
.acts button.on{background:#EEF2FF;border-color:#C7D2FE;color:#4338CA}
.div{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--m);margin:10px 0 2px}
.muted{font-size:.78rem;color:var(--m)}
.bar{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);width:calc(100% - 40px);max-width:420px;z-index:30}
.bar .btn{padding:15px;border-radius:16px;box-shadow:0 10px 25px -5px rgba(15,23,42,.25)}
#modal{position:fixed;inset:0;background:rgba(15,23,42,.35);backdrop-filter:blur(4px);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:460px;background:var(--s);border-radius:24px 24px 0 0;padding:20px 20px 28px;max-height:90vh;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.mt{font-size:1.02rem;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.rv{display:flex;justify-content:space-between;gap:8px;font-size:.85rem;padding-bottom:6px;border-bottom:1px dashed var(--b)}
.rv.best{background:var(--acs);border-radius:8px;padding:6px}
.icons{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.icons div{height:42px;border-radius:10px;border:1px solid var(--b);background:var(--s2);font-size:1.2rem;display:flex;align-items:center;justify-content:center}
.icons div.sel{border-color:var(--t);background:var(--b)}
.cmp{display:grid;grid-template-columns:20px 1fr 1fr 70px;gap:6px;align-items:center}
.cmp input,.cmp select{width:100%;padding:9px 8px;border-radius:10px;border:1px solid var(--b);background:var(--s2);font-size:.85rem;color:var(--t)}
details{background:var(--s);border:1px solid var(--b);border-radius:var(--r);padding:12px 14px;margin-bottom:10px}
summary{font-size:.88rem;font-weight:600;cursor:pointer}
#login{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;align-items:center;justify-content:center;padding:24px}
.lc{width:100%;max-width:360px;background:var(--s);border:1px solid var(--b);border-radius:24px;padding:32px 24px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
</style>
</head>
<body>
<div id="login" class="hidden"><div class="lc">
  <div style="font-size:1.25rem;font-weight:800">Bora Comprar</div>
  <div class="muted">Digite a senha para desbloquear neste aparelho</div>
  <input id="pinInput" type="password" class="in" style="text-align:center;letter-spacing:.15em" placeholder="••••" onkeydown="if(event.key==='Enter')submitLogin()" />
  <div id="loginErr" class="muted hidden" style="color:var(--d);font-weight:600">Senha incorreta.</div>
  <button id="btnLogin" class="btn" onclick="submitLogin()">Entrar</button>
</div></div>

<div class="shell">
  <header>
    <div class="hl">
      <button id="btnBack" class="ib hidden" data-a="back">←</button>
      <img class="logo" src="https://lh3.googleusercontent.com/d/1MuC92zVngc48Wm9XzqRWErIS8CyT3fLp=s512" alt="" onerror="this.style.display='none'" />
      <div class="ttl" id="title">Bora Comprar</div>
    </div>
    <div class="hl"><span id="dot" class="dot"></span><button id="btnAdd" class="ib hidden" data-a="itemNew">＋</button></div>
  </header>
  <main>
    <section id="v_home">
      <div class="grid2">
        <div class="big" data-a="mode" data-m="plan"><span class="em">📝</span>Colocar na lista</div>
        <div class="big buy" data-a="mode" data-m="buy"><span id="homeBadge" class="pill hidden">0</span><span class="em">🛒</span>Comprar</div>
        <div class="big" data-a="hist"><span class="em">🧾</span>Histórico</div>
        <div class="big" data-a="cmp"><span class="em">⚖️</span>Comparar preços</div>
      </div>
      <div class="box">
        <div class="cap">✦ Assistente rápido</div>
        <div class="row"><input id="aiInput" class="in" placeholder="Ex: colocar 2 pct feijão na lista" onkeydown="if(event.key==='Enter')aiParse()" /><button class="btn fit" onclick="aiParse()">OK</button></div>
        <div id="aiBox" class="hidden" style="margin-top:14px;padding-top:14px;border-top:1px solid var(--b)">
          <div id="aiChips" class="chips"></div>
          <div id="aiCatRow" class="hidden" style="margin-bottom:10px"><div class="sl" style="margin-bottom:4px">Produto novo: escolha a categoria</div><select id="aiCat" class="in"></select></div>
          <div class="row">
            <div class="step"><button data-a="aiStep" data-d="-1">−</button><input id="aiQty" type="number" step="any" class="qi" value="1" /><button data-a="aiStep" data-d="1">+</button></div>
            <button id="aiCheap" class="chip am" data-a="aiCheap">Se barato</button>
            <button class="btn fit" style="padding:10px 14px" data-a="aiOk">Confirmar</button>
          </div>
        </div>
      </div>
    </section>

    <section id="v_cats" class="hidden">
      <div id="sumTop" class="sum hidden"><div><div class="sl">Total no carrinho</div><div class="sv" id="sumTotal">R$ 0,00</div></div><div style="text-align:right"><div class="sl">Faltam pegar</div><b id="sumPend">0</b></div></div>
      <div class="tool">
        <input id="q" class="in" placeholder="🔍 Buscar item (em todas as categorias)" />
        <button id="btnEdit" class="chip" data-a="edit">✎ Editar</button>
        <button id="btnAll" class="chip hidden" data-a="all">📋 Lista completa</button>
        <button id="btnCmp" class="chip hidden" data-a="cmp">⚖️ Comparar</button>
      </div>
      <div id="catsBody"></div>
    </section>

    <section id="v_items" class="hidden">
      <div id="sumCat" class="sum hidden"><div><div class="sl">Total da compra</div><div class="sv" id="catTotal">R$ 0,00</div></div><span class="muted">Qtd/valor e ✓</span></div>
      <div id="itemsBody" class="list"></div>
    </section>

    <section id="v_hist" class="hidden"><div id="histBody"></div></section>
  </main>
  <div id="finBar" class="bar hidden"><button class="btn" data-a="fin">Finalizar compra</button></div>
</div>
<div id="modal" class="hidden"></div>

<script>
const API_URL="https://script.google.com/macros/s/AKfycbz9WGC54ZvPIvsviO_6ACZMFDkso7wGM363iaZcpWoGIKkplKUWfEE84t9KGqu187qZHw/exec";
const PK="bora_comprar_auth_pin",SK="bora_comprar_state_v3";
const ICONS={package:'📦',apple:'🍎',beef:'🥩',cheese:'🧀',croissant:'🥐',cup:'🥤',flame:'🌶️',can:'🥫',wheat:'🌾',candy:'🍫',snowflake:'❄️',sparkles:'✨',heart:'🧴',box:'🛍️',cart:'🛒',leaf:'🥬',fish:'🐟',coffee:'☕',baby:'🍼',pet:'🐾',pill:'💊',home:'🏠',star:'⭐',tag:'🏷️'};
const VARIANTS={feijao:[['Feijão','Não Perecíveis'],['Feijão Preto','Não Perecíveis'],['Feijão Vermelho','Não Perecíveis'],['Feijão Carioca (Marrom)','Não Perecíveis']],arroz:[['Arroz','Não Perecíveis'],['Arroz japa','Não Perecíveis'],['Arroz Integral','Não Perecíveis']],queijo:[['Queijo','Frios'],['Parmesão','Frios'],['Requeijão','Frios'],['Creme de Ricota','Frios']]};
const S={cats:[],items:{},view:'home',mode:null,cat:null,edit:false,all:false,q:'',hist:null,ai:null,ed:null,cmp:[{p:'',q:'',u:'g'},{p:'',q:'',u:'g'}],market:''};
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
const brl=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const pin=()=>localStorage.getItem(PK)||'';
const all=()=>S.cats.flatMap(c=>S.items[c.name]||[]);
const find=(c,n)=>(S.items[c]||[]).find(i=>i.name===n);
const needed=i=>(Number(i.listQty)>0||i.ifCheap)&&!i.inCart;
const ctx=el=>{const c=el.closest('[data-n]');return c&&find(c.dataset.c,c.dataset.n)};
const dd=i=>`data-c="${esc(i.category)}" data-n="${esc(i.name)}"`;
const fd=s=>{const[a,b]=String(s).split(' ');const[y,m,d]=a.split('-');return`${d}/${m}/${y}`+(b?' '+b:'')};

/* ---------- REDE / SINCRONIZAÇÃO ---------- */
let pend=0,chain=Promise.resolve(),ver='',tick=0;
const dot=on=>$('dot').classList.toggle('sy',on);
function persist(){localStorage.setItem(SK,JSON.stringify({cats:S.cats,items:S.items}))}
function post(payload){
  pend++;dot(1);persist();
  const p=chain=chain.then(()=>fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({...payload,pin:pin()})}).then(r=>r.json()).then(r=>{if(r.authError)logout();return r}).catch(()=>({ok:false}))).then(r=>{if(--pend===0)dot(0);return r});
  return p;
}
async function get(action){
  const j=await(await fetch(`${API_URL}?action=${action}&pin=${encodeURIComponent(pin())}`)).json();
  if(j.authError){logout();throw 0}return j;
}
function logout(){localStorage.removeItem(PK);showLogin(true)}
function showLogin(err){$('login').classList.remove('hidden');$('loginErr').classList.toggle('hidden',!err);setTimeout(()=>$('pinInput').focus(),100)}
async function submitLogin(){
  const p=$('pinInput').value.trim();if(!p)return;
  const b=$('btnLogin');b.textContent='Verificando...';b.disabled=true;
  try{
    const j=await(await fetch(`${API_URL}?action=getData&pin=${encodeURIComponent(p)}`)).json();
    if(j.ok&&j.data){localStorage.setItem(PK,p);$('login').classList.add('hidden');$('pinInput').value='';apply(j.data)}
    else showLogin(true);
  }catch(e){alert('Erro de conexão. Verifique a internet.')}
  b.textContent='Entrar';b.disabled=false;
}
function apply(d){S.cats=(d.categories||[]);S.items=d.itemsByCategory||{};persist();render()}
const typing=()=>['INPUT','SELECT','TEXTAREA'].includes((document.activeElement||{}).tagName)||!$('modal').classList.contains('hidden');
async function poll(force){
  if(!pin()||document.hidden||pend||(!force&&typing()))return;
  try{
    const r=await get('version');
    if(force||r.v!==ver){
      const d=await get('getData');
      if(!pend&&(force||!typing())){apply(d.data);ver=r.v}
    }
  }catch(e){}
}
// no mercado: a cada 3s; fora dele: a cada ~15s
setInterval(()=>{tick++;if(S.mode==='buy'||tick%5===0)poll()},3000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll()});

/* ---------- RENDER ---------- */
function totals(){
  let total=0,pending=0,cart=[];
  all().forEach(i=>{
    if(needed(i))pending++;
    if(i.inCart){const q=Number(i.cartQty)>0?Number(i.cartQty):Number(i.listQty||1);const sub=q*Number(i.unitPrice||0);total+=sub;cart.push({...i,q,sub})}
  });
  return{total,pending,cart};
}
function sums(){
  const t=totals();
  if($('sumTotal')){$('sumTotal').textContent=brl(t.total);$('sumPend').textContent=t.pending+(t.pending===1?' produto':' produtos');$('catTotal').textContent=brl(t.total)}
  const b=$('homeBadge');b.textContent=t.pending;b.classList.toggle('hidden',!t.pending);
}
function render(){
  ['home','cats','items','hist'].forEach(v=>$('v_'+v).classList.toggle('hidden',S.view!==v));
  $('btnBack').classList.toggle('hidden',S.view==='home');
  $('btnAdd').classList.toggle('hidden',S.view!=='items');
  $('title').textContent={home:'Bora Comprar',cats:S.mode==='plan'?'Colocar na lista':'Comprar',items:S.cat,hist:'Histórico'}[S.view];
  $('finBar').classList.toggle('hidden',!(S.mode==='buy'&&S.view==='cats'));
  const buy=S.mode==='buy';
  $('sumTop').classList.toggle('hidden',!buy);$('sumCat').classList.toggle('hidden',!buy);
  $('btnAll').classList.toggle('hidden',!buy);$('btnCmp').classList.toggle('hidden',!buy);
  $('btnEdit').textContent=S.edit?'✓ Pronto':'✎ Editar';$('btnEdit').classList.toggle('on',S.edit);
  $('btnAll').classList.toggle('on',S.all);$('btnAll').textContent=S.all?'🗂 Por setor':'📋 Lista completa';
  if(S.view==='cats')rBody();
  if(S.view==='items')rItems();
  if(S.view==='hist')rHist();
  sums();
}
function planCard(i){
  return`<div class="item" ${dd(i)}><div class="row"><div class="tg"><b>${esc(i.name)}</b><span class="tag">${i.unit}</span><span class="tag">${esc(i.category)}</span></div><button class="ib sm" data-a="itemEd">✎</button></div>
  <div class="row"><div class="step"><button data-a="pq" data-d="-1">−</button><input type="number" step="any" class="qi" data-f="plan" value="${i.listQty||0}"><button data-a="pq" data-d="1">+</button></div>
  <button class="chip am ${i.ifCheap?'on':''}" data-a="cheap">🏷️ Se barato</button></div></div>`;
}
function buyCard(i){
  const kg=i.unit==='kg',q=i.cartQty>0?i.cartQty:(i.listQty>0?i.listQty:''),p=i.unitPrice>0?i.unitPrice:'';
  const on=needed(i)||i.inCart;
  return`<div class="item ${i.inCart?'cart':(needed(i)?'':'dim')}" ${dd(i)}>
  <div class="row"><div class="tg"><b>${esc(i.name)}</b><span class="tag">${kg?'kg':'un'}</span>${i.ifCheap?'<span class="cheapb">Se barato</span>':''}${i.ignore?'<span class="ignb">Próxima compra</span>':''}</div>${i.listQty>0?`<span class="req">Ped: ${i.listQty} ${i.unit}</span>`:''}</div>
  <div class="bc"><div class="fm"><label>${kg?'Peso (kg)':'Qtd pega'}</label><input type="number" inputmode="decimal" step="any" data-f="qty" placeholder="${i.listQty||1}" value="${q}"></div>
  <div class="fm"><label>${kg?'R$ / kg':'R$ unit.'}</label><input type="number" inputmode="decimal" step="0.01" data-f="price" placeholder="0,00" value="${p}"></div>
  <button class="chk ${i.inCart?'on':''}" data-a="check">✓</button></div>
  <div class="acts">${needed(i)?`<button class="${i.ignore?'on':''}" data-a="ign">${i.ignore?'↩ Voltar p/ compra':'⏭ Ignorar nessa compra'}</button>`:''}${on?'<button data-a="rm">✕ Tirar da lista</button>':''}<button data-a="itemEd">✎ Editar/mover</button><button data-a="price">🕘 Preço anterior</button></div></div>`;
}
function rBody(){
  const buy=S.mode==='buy',b=$('catsBody'),q=norm(S.q);
  if(q){
    const r=all().filter(i=>norm(i.name).includes(q));
    const exact=all().some(i=>norm(i.name)===q);
    b.innerHTML=`<div class="list">${r.map(buy?buyCard:planCard).join('')}${exact?'':`<button class="btn sec" data-a="addq">＋ Adicionar “${esc(S.q.trim())}” como novo item</button>`}</div>`;return;
  }
  if(buy&&S.all){
    const h=S.cats.map(c=>{
      const l=(S.items[c.name]||[]).filter(i=>needed(i)||i.inCart).sort((a,b)=>a.inCart-b.inCart);
      return l.length?`<div class="div">${ICONS[c.icon]||'📦'} ${esc(c.name)} · faltam ${l.filter(needed).length}</div>`+l.map(buyCard).join(''):'';
    }).join('');
    b.innerHTML=`<div class="list">${h||'<div class="muted">Nenhum item na lista.</div>'}</div>`;return;
  }
  b.innerHTML=`<div class="grid">`+S.cats.map(c=>{
    const n=(S.items[c.name]||[]).filter(needed).length;
    return`<div class="cat" data-a="cat" data-cn="${esc(c.name)}">${n?`<span class="bdg">${n}</span>`:''}
    <div class="ci">${ICONS[c.icon]||'📦'}</div><div class="cn">${esc(c.name)}</div>
    ${S.edit?`<div class="edt"><button data-a="catEd" data-cn="${esc(c.name)}">✎</button><button data-a="catUp" data-cn="${esc(c.name)}">▲</button><button data-a="catDn" data-cn="${esc(c.name)}">▼</button></div>`:''}</div>`;
  }).join('')+`<div class="cat add" data-a="catEd" data-cn=""><div class="ci" style="background:transparent">＋</div><div class="cn">Nova categoria</div></div></div>`;
}
function rItems(){
  const l=S.items[S.cat]||[];
  if(S.mode!=='buy'){$('itemsBody').innerHTML=l.map(planCard).join('');return}
  const t1=l.filter(needed),t2=l.filter(i=>i.inCart),t3=l.filter(i=>!needed(i)&&!i.inCart);
  $('itemsBody').innerHTML=(t1.length?`<div class="div">Falta pegar (${t1.length})</div>`+t1.map(buyCard).join(''):'')+(t2.length?`<div class="div">No carrinho (${t2.length})</div>`+t2.map(buyCard).join(''):'')+(t3.length?`<div class="div">Outros da categoria</div>`+t3.map(buyCard).join(''):'');
}

/* ---------- HISTÓRICO / PREÇOS ---------- */
async function loadHist(){try{S.hist=(await get('getHistory')).data}catch(e){}}
function rHist(){
  const el=$('histBody');
  if(!S.hist){el.innerHTML='<div class="muted">Carregando...</div>';loadHist().then(()=>{if(S.view==='hist')rHist()});return}
  const g=new Map();
  S.hist.forEach(r=>{if(!g.has(r[0]))g.set(r[0],{d:r[1],m:r[2],rows:[],t:0});const x=g.get(r[0]);x.rows.push(r);x.t+=r[8]});
  const l=[...g.entries()].sort((a,b)=>b[0].localeCompare(a[0]));
  el.innerHTML=l.length?l.map(([id,x])=>`<details><summary>${fd(x.d)} · ${esc(x.m)}<br><span class="muted">${x.rows.length} itens · <b style="color:var(--ac)">${brl(x.t)}</b></span></summary><div class="list" style="margin-top:10px">${x.rows.map(r=>`<div class="rv"><span>${esc(r[4])}<br><span class="muted">${String(r[6]).replace('.',',')} ${r[5]} × ${brl(r[7])}</span></span><b>${brl(r[8])}</b></div>`).join('')}<div class="rv"><b>Total</b><b>${brl(x.t)}</b></div></div></details>`).join(''):'<div class="muted">Nenhuma compra finalizada ainda.</div>';
}
function priceInfo(name){
  const n=norm(name);if(!n)return'';
  const r=(S.hist||[]).filter(x=>norm(x[4])===n&&x[7]>0).sort((a,b)=>b[1].localeCompare(a[1]));
  if(!r.length)return'<div class="muted">Sem compras anteriores registradas para este produto.</div>';
  const min=r.reduce((a,x)=>x[7]<a[7]?x:a,r[0]);
  return r.slice(0,4).map(x=>`<div class="rv"><span>${fd(x[1]).split(' ')[0]} · ${esc(x[2])}</span><b>${brl(x[7])}/${x[5]}</b></div>`).join('')+`<div class="muted">Menor já pago: <b>${brl(min[7])}</b> (${fd(min[1]).split(' ')[0]})</div>`;
}

/* ---------- COMPARADOR ---------- */
const F={g:1,kg:1000,ml:1,L:1000,un:1},FAM={g:'w',kg:'w',ml:'v',L:'v',un:'u'},LBL={w:'kg',v:'L',u:'un'};
function cmpModal(){
  modal(`<div class="mt">⚖️ Comparar preço × quantidade<button class="ib" data-a="close">✕</button></div>
  <div id="cmpRows" class="list">${S.cmp.map((r,k)=>`<div class="cmp"><b>${'ABCD'[k]}</b><input type="number" inputmode="decimal" step="any" placeholder="Preço R$" value="${r.p}" data-f="cmp" data-k="p" data-i="${k}"><input type="number" inputmode="decimal" step="any" placeholder="Quantidade" value="${r.q}" data-f="cmp" data-k="q" data-i="${k}"><select data-f="cmp" data-k="u" data-i="${k}">${Object.keys(F).map(u=>`<option ${u===r.u?'selected':''}>${u}</option>`).join('')}</select></div>`).join('')}</div>
  ${S.cmp.length<4?'<button class="btn sec" data-a="cmpAdd">＋ Mais uma opção</button>':''}
  <div id="cmpRes" class="list"></div>
  <div class="cap" style="margin:6px 0 0">Preço anterior de um produto</div>
  <input id="cmpName" class="in" list="dl" placeholder="Digite o nome do produto"><datalist id="dl">${[...new Set(all().map(i=>i.name))].map(n=>`<option value="${esc(n)}">`).join('')}</datalist>
  <div id="cmpHist" class="list"></div>`);
  calcCmp();
}
function calcCmp(){
  const rows=S.cmp.map((r,k)=>{const p=parseFloat(r.p),q=parseFloat(r.q);if(!(p>0&&q>0))return null;const f=FAM[r.u];return{k,f,v:p/(q*F[r.u])*(f==='u'?1:1000)}});
  const ok=rows.filter(Boolean),el=$('cmpRes');
  if(ok.length<2){el.innerHTML='<div class="muted">Preencha preço e quantidade de pelo menos duas opções.</div>';return}
  if(new Set(ok.map(x=>x.f)).size>1){el.innerHTML='<div class="muted" style="color:var(--d)">Unidades incompatíveis (ex: g com ml).</div>';return}
  const min=Math.min(...ok.map(x=>x.v));
  el.innerHTML=ok.map(r=>`<div class="rv ${r.v===min?'best':''}"><span>Opção ${'ABCD'[r.k]}</span><b>${brl(r.v)}/${LBL[r.f]} ${r.v===min?'🏆 melhor':'(+'+Math.round((r.v/min-1)*100)+'%)'}</b></div>`).join('');
}

/* ---------- MODAIS ---------- */
function modal(h){const m=$('modal');m.innerHTML=`<div class="sheet">${h}</div>`;m.classList.remove('hidden')}
function closeModal(){$('modal').classList.add('hidden');$('modal').innerHTML=''}
$('modal').addEventListener('click',e=>{if(e.target===$('modal'))closeModal()});

function itemModal(i){
  const cat=i?i.category:(S.cat||(S.cats[0]||{}).name);
  S.ed={old:i?i.name:null,cat,unit:i?i.unit:'un',pre:''};
  if(!i&&S.q)S.ed.pre=S.q.trim();
  modal(`<div class="mt">${i?'Editar item':'Novo item'}<button class="ib" data-a="close">✕</button></div>
  <input id="fName" class="in" placeholder="Nome do produto" value="${esc(i?i.name:S.ed.pre)}">
  <div class="row"><button id="uUn" class="chip ${S.ed.unit==='un'?'on':''}" style="flex:1" data-a="unit" data-u="un">Unidade (un)</button><button id="uKg" class="chip ${S.ed.unit==='kg'?'on':''}" style="flex:1" data-a="unit" data-u="kg">Granel (kg)</button></div>
  <div class="sl">Categoria</div><select id="fCat" class="in">${S.cats.map(c=>`<option ${c.name===cat?'selected':''}>${esc(c.name)}</option>`).join('')}</select>
  <button class="btn" data-a="saveItem">Salvar</button>
  ${i&&S.mode==='plan'?'<button class="btn danger" data-a="delItem">🗑 Excluir permanentemente</button>':''}`);
}
function catModal(name){
  const c=S.cats.find(x=>x.name===name);
  S.ed={old:name||null,icon:c?c.icon:'package'};
  modal(`<div class="mt">${name?'Editar categoria':'Nova categoria'}<button class="ib" data-a="close">✕</button></div>
  <input id="cName" class="in" placeholder="Nome da categoria" value="${esc(name||'')}">
  <div class="sl">Ícone</div><div class="icons" id="icons"></div><button class="btn" data-a="saveCat">Salvar categoria</button>`);
  rIcons();
}
const rIcons=()=>{$('icons').innerHTML=Object.entries(ICONS).map(([k,e])=>`<div class="${S.ed.icon===k?'sel':''}" data-a="icon" data-k="${k}">${e}</div>`).join('')};

function finModal(){
  const t=totals(),pl=all().filter(needed);
  modal(`<div class="mt">Revisão da compra<button class="ib" data-a="close">✕</button></div>
  <div class="list">${t.cart.length?t.cart.map(i=>`<div class="rv"><span><b>${esc(i.name)}</b><br><span class="muted">${String(i.q).replace('.',',')} ${i.unit} × ${brl(i.unitPrice)}</span></span><b>${brl(i.sub)}</b></div>`).join(''):'<div class="muted">Nenhum item marcado com ✓.</div>'}</div>
  <div class="row"><b>Total</b><b class="sv">${brl(t.total)}</b></div>
  ${pl.length?`<div class="div">⚠️ Pendências (${pl.length})</div><div class="muted">Marque “próxima compra” para manter na lista; os demais saem da lista.</div>
  <div class="list">${pl.map(i=>`<div class="rv" ${dd(i)}><span>${esc(i.name)}<br><span class="muted">${i.ignore?'fica para a próxima compra':'sai da lista'}</span></span><span class="acts"><button class="${i.ignore?'on':''}" data-a="ign2">⏭ Próxima</button><button data-a="rm2">✕ Tirar</button></span></div>`).join('')}</div>`:'<div class="muted">✓ Nenhuma pendência.</div>'}
  <input id="market" class="in" placeholder="Em qual mercado? (ex: Verdemar)" value="${esc(S.market)}">
  <button class="btn ok" data-a="finOk" ${t.cart.length?'':'disabled style="opacity:.4"'}>Confirmar e salvar no histórico</button>`);
}

/* ---------- AÇÕES ---------- */
const saveI=i=>post({action:'saveItemState',...i});
const A={
  close:closeModal,
  mode(b){S.mode=b.dataset.m;S.view='cats';S.q='';$('q').value='';S.edit=false;S.all=false;if(S.mode==='buy')loadHist();render()},
  back(){if(S.view==='items')S.view='cats';else{S.view='home';S.mode=null}render()},
  cat(b){S.cat=b.dataset.cn;S.view='items';render()},
  edit(){S.edit=!S.edit;render()},
  all(){S.all=!S.all;render()},
  catEd(b){catModal(b.dataset.cn||null)},
  catUp(b){mv(b.dataset.cn,-1)},catDn(b){mv(b.dataset.cn,1)},
  icon(b){S.ed.icon=b.dataset.k;rIcons()},
  saveCat(){
    const n=$('cName').value.trim();if(!n)return;const o=S.ed.old;
    if(o){const c=S.cats.find(x=>x.name===o);c.name=n;c.icon=S.ed.icon;if(o!==n){S.items[n]=(S.items[o]||[]).map(i=>({...i,category:n}));delete S.items[o]}}
    else{S.cats.push({name:n,icon:S.ed.icon});S.items[n]=S.items[n]||[]}
    post({action:'saveCategory',oldName:o,name:n,icon:S.ed.icon});closeModal();render();
  },
  itemNew(){itemModal(null)},
  itemEd(b){itemModal(ctx(b))},
  unit(b){S.ed.unit=b.dataset.u;$('uUn').classList.toggle('on',S.ed.unit==='un');$('uKg').classList.toggle('on',S.ed.unit==='kg')},
  saveItem(){
    const name=$('fName').value.trim(),cat=$('fCat').value,u=S.ed.unit;if(!name)return;
    if(S.ed.old){
      const i=find(S.ed.cat,S.ed.old),oc=i.category;i.name=name;i.unit=u;
      if(cat!==oc){S.items[oc]=S.items[oc].filter(x=>x!==i);i.category=cat;(S.items[cat]=S.items[cat]||[]).push(i)}
      post({action:'editItem',category:oc,oldName:S.ed.old,newName:name,unit:u,newCategory:cat});
    }else{
      let i=find(cat,name);
      if(i){i.listQty=Math.max(1,Number(i.listQty)||0)}
      else{i={category:cat,name,unit:u,listQty:1,ifCheap:false,inCart:false,cartQty:0,unitPrice:0,ignore:false};(S.items[cat]=S.items[cat]||[]).push(i)}
      saveI(i);
    }
    closeModal();render();
  },
  delItem(){
    if(!confirm('Excluir este item permanentemente?'))return;
    const c=S.ed.cat;S.items[c]=S.items[c].filter(i=>i.name!==S.ed.old);
    post({action:'deleteItem',category:c,name:S.ed.old});closeModal();render();
  },
  addq(){itemModal(null)},
  pq(b){const i=ctx(b);const st=i.unit==='kg'?.5:1;i.listQty=Math.max(0,Math.round((Number(i.listQty||0)+b.dataset.d*st)*100)/100);saveI(i);render()},
  cheap(b){const i=ctx(b);i.ifCheap=!i.ifCheap;saveI(i);render()},
  check(b){
    const i=ctx(b),card=b.closest('.item');
    const q=card.querySelector('[data-f=qty]').value,p=card.querySelector('[data-f=price]').value;
    if(q!=='')i.cartQty=parseFloat(q);if(p!=='')i.unitPrice=parseFloat(p);
    i.inCart=!i.inCart;
    if(i.inCart){i.ignore=false;if(!(i.cartQty>0))i.cartQty=i.listQty>0?i.listQty:1}
    saveI(i);render();
  },
  ign(b){const i=ctx(b);i.ignore=!i.ignore;saveI(i);render()},
  rm(b){const i=ctx(b);Object.assign(i,{listQty:0,ifCheap:false,inCart:false,cartQty:0,unitPrice:0,ignore:false});saveI(i);render()},
  async price(b){const i=ctx(b);if(!S.hist)await loadHist();modal(`<div class="mt">🕘 ${esc(i.name)}<button class="ib" data-a="close">✕</button></div><div class="list">${priceInfo(i.name)}</div>`)},
  hist(){S.view='hist';S.mode=null;rHist();render()},
  cmp(){cmpModal();if(!S.hist)loadHist()},
  cmpAdd(){S.cmp.push({p:'',q:'',u:S.cmp[0].u});cmpModal()},
  fin(){finModal()},
  ign2(b){const i=ctx(b);i.ignore=!i.ignore;saveI(i);S.market=$('market').value;finModal()},
  rm2(b){A.rm(b);S.market=$('market').value;finModal()},
  finOk(){
    const market=$('market').value.trim()||'Mercado';S.market='';
    const snap=all().map(i=>({...i}));
    all().forEach(i=>{
      if(i.inCart){i.listQty=0;i.ifCheap=false}else if(!i.ignore){i.listQty=0;i.ifCheap=false}
      Object.assign(i,{inCart:false,cartQty:0,unitPrice:0,ignore:false});
    });
    closeModal();render();
    post({action:'finalizePurchase',market,items:snap}).then(()=>{S.hist=null;loadHist()});
  },
  aiStep(b){const e=$('aiQty');let v=parseFloat(e.value||1)+Number(b.dataset.d);if(v<.5)v=.5;e.value=v;S.ai.qty=v},
  aiCheap(){S.ai.cheap=!S.ai.cheap;$('aiCheap').classList.toggle('on',S.ai.cheap)},
  aiOk:aiConfirm,
  aiSel(b){S.ai.sel=Number(b.dataset.i);aiRender()}
};
function mv(n,d){
  const k=S.cats.findIndex(c=>c.name===n),j=k+d;if(j<0||j>=S.cats.length)return;
  [S.cats[k],S.cats[j]]=[S.cats[j],S.cats[k]];
  post({action:'reorderCategories',names:S.cats.map(c=>c.name)});rBody();
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&A[b.dataset.a])A[b.dataset.a](b,e)});
document.addEventListener('change',e=>{
  const f=e.target.dataset.f;if(!f||f==='cmp')return;
  const i=ctx(e.target);if(!i)return;
  if(f==='plan'){i.listQty=Math.max(0,parseFloat(e.target.value||0));saveI(i);sums()}
  else{
    const c=e.target.closest('.item');
    const q=c.querySelector('[data-f=qty]').value,p=c.querySelector('[data-f=price]').value;
    i.cartQty=parseFloat(q||0);i.unitPrice=parseFloat(p||0);saveI(i);sums();
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='q'){S.q=t.value;rBody()}
  else if(t.dataset.f==='cmp'){S.cmp[t.dataset.i][t.dataset.k]=t.value;calcCmp()}
  else if(t.id==='cmpName'){$('cmpHist').innerHTML=priceInfo(t.value)}
});

/* ---------- ASSISTENTE RÁPIDO ---------- */
const CONN=new Set(['de','do','da','dos','das','com','sem','em','para','ao','a','o','e']);
function aiParse(){
  const raw=$('aiInput').value.trim();if(!raw)return;
  const n=norm(raw),cheap=n.includes('barato')||n.includes('promocao');
  const qm=n.match(/(\d+(?:[.,]\d+)?)/),qty=qm?parseFloat(qm[1].replace(',','.')):1;
  let cl=n.replace(/(\d+(?:[.,]\d+)?)/g,' ').replace(/\b(colocar|coloca|acrescentar|acrescenta|adicionar|adiciona|por|poe|comprar|compra|na\s+lista|no\s+carrinho|na|no|lista|se\s+estiver\s+barato|se\s+tiver\s+barato|se\s+barato|estiver|tiver|barato|promocao|pct|pcts|pacote|pacotes|un|und|unidade|unidades|kg|quilo|quilos|g|gramas|lata|latas|caixa|caixas|cx|garrafa|garrafas|pote|potes|saco|sacos)\b/g,' ').replace(/\s+/g,' ').trim();
  let tk=cl.split(' ').filter(Boolean);
  while(tk.length&&CONN.has(tk[0]))tk.shift();while(tk.length&&CONN.has(tk[tk.length-1]))tk.pop();
  cl=tk.join(' ');if(!cl)return;
  const sig=tk.filter(t=>!CONN.has(t)),full=[],part=[];
  S.cats.forEach(c=>(S.items[c.name]||[]).forEach(it=>{
    const nn=norm(it.name),itk=nn.split(' ').filter(t=>t&&!CONN.has(t));
    const o={name:it.name,category:c.name,unit:it.unit,exists:true};
    if(nn===cl)full.push({...o,s:100});
    else if(nn.includes(cl))full.push({...o,s:90});
    else if(sig.length&&sig.every(st=>itk.some(p=>p.includes(st)||st.includes(p))))full.push({...o,s:80});
    else if(sig.length===1&&itk.some(p=>p.includes(sig[0])))part.push({...o,s:50});
  }));
  const srt=(a,b)=>b.s-a.s||a.name.length-b.name.length;full.sort(srt);part.sort(srt);
  let m=full.length?full:part;
  if(sig.length===1&&VARIANTS[sig[0]])VARIANTS[sig[0]].forEach(([name,category])=>{if(!m.some(x=>norm(x.name)===norm(name)))m.push({name,category,unit:'un',exists:false})});
  if(!m.length)m.push({name:cl.charAt(0).toUpperCase()+cl.slice(1),category:'',unit:'un',exists:false});
  S.ai={opts:m,sel:0,qty,cheap};aiRender();
}
function aiRender(){
  const a=S.ai;$('aiBox').classList.remove('hidden');
  $('aiChips').innerHTML=a.opts.map((o,k)=>`<button class="chip ${k===a.sel?'on':''}" data-a="aiSel" data-i="${k}">${esc(o.name)} <span style="opacity:.65;font-size:.7rem">${o.exists?'('+esc(o.category)+')':'(novo)'}</span></button>`).join('');
  const o=a.opts[a.sel];$('aiCatRow').classList.toggle('hidden',o.exists);
  $('aiCat').innerHTML=S.cats.map(c=>`<option ${c.name===o.category?'selected':''}>${esc(c.name)}</option>`).join('');
  $('aiQty').value=a.qty;$('aiCheap').classList.toggle('on',a.cheap);
}
function aiConfirm(){
  const a=S.ai;if(!a)return;const o=a.opts[a.sel],qty=parseFloat($('aiQty').value||1);
  const cat=o.exists?o.category:$('aiCat').value;if(!cat)return;
  let i=find(cat,o.name);
  if(i){i.listQty=Number(i.listQty||0)+qty;if(a.cheap)i.ifCheap=true}
  else{i={category:cat,name:o.name,unit:o.unit||'un',listQty:qty,ifCheap:a.cheap,inCart:false,cartQty:0,unitPrice:0,ignore:false};(S.items[cat]=S.items[cat]||[]).push(i)}
  saveI(i);$('aiInput').value='';$('aiBox').classList.add('hidden');S.ai=null;sums();
}

/* ---------- INÍCIO ---------- */
(function init(){
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
  try{const s=JSON.parse(localStorage.getItem(SK)||'null');if(s){S.cats=s.cats;S.items=s.items}}catch(e){}
  render();
  if(pin())poll(true);else showLogin(false);
})();
</script>
